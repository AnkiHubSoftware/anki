version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    pre_install:
      - curl https://sh.rustup.rs -sSf | sh -s -- -y
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustc --version
      - cargo --version

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
